services:
  nginx:
    image: nginx:alpine
    container_name: 8081-nginx
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - appnet

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: 8081-php
    volumes:
      - ./:/var/www
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      APP_KEY: ${APP_KEY}
    networks:
      - appnet

networks:
  appnet:
    external: true
    name: ${DOCKER_NETWORK}
